# `version:` is gone -- Compose v2 ignores it and warns that it is obsolete.
services:
  api:
    build: .
    container_name: zian_tsabit_be_api
    ports:
      - "8000:8000"
    environment:
      # settings.py reads all three now; before this they were passed and ignored.
      DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 [::1]"
      DJANGO_SECRET_KEY: "django-insecure-local-compose-only"
    volumes:
      # Source mount, so runserver's autoreload picks up edits and db.sqlite3
      # changes land on the host rather than in a discarded layer.
      - .:/app
    # If `id -u` on your host is not 1000, uncomment and set it, or the mounted
    # db.sqlite3 is read-only to the container and the migrate on start fails.
    # user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      # No curl in python:3.12-slim, and the image already has Python. /api/
      # is public, so this needs no credentials.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/').status"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
